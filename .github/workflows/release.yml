name: Release & Create PR

on:
  workflow_dispatch:
    inputs:
      web_version:
        description: 'Web/Main App Version (e.g., 2.1.2 or v2.1.2)'
        required: true
        type: string
      admin_version:
        description: 'Admin Panel Version (e.g., 1.0.0 or v1.0.0, optional)'
        required: false
        type: string
      target_branch:
        description: 'Target Base Branch for PR (default: master)'
        required: true
        default: 'master'
        type: string
      create_tag_and_release:
        description: 'Create Git Tag and GitHub Release on merge? (creates after PR merge or now)'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Custom Release Notes (optional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: 🚀 Bump Versions & Create Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Parse and Normalize Versions
        id: version_info
        run: |
          # Web / Main Version
          RAW_WEB_VERSION="${{ github.event.inputs.web_version }}"
          CLEAN_WEB_VERSION=$(echo "$RAW_WEB_VERSION" | sed -E 's/^[vV]//')
          WEB_TAG="v${CLEAN_WEB_VERSION}"

          if [ -z "$CLEAN_WEB_VERSION" ]; then
            echo "Error: Web version cannot be empty."
            exit 1
          fi

          # Admin Version (optional)
          RAW_ADMIN_VERSION="${{ github.event.inputs.admin_version }}"
          CLEAN_ADMIN_VERSION=$(echo "$RAW_ADMIN_VERSION" | sed -E 's/^[vV]//')

          echo "clean_web_version=$CLEAN_WEB_VERSION" >> $GITHUB_OUTPUT
          echo "web_tag=$WEB_TAG" >> $GITHUB_OUTPUT
          echo "clean_admin_version=$CLEAN_ADMIN_VERSION" >> $GITHUB_OUTPUT

          echo "Web Version: $CLEAN_WEB_VERSION (Tag: $WEB_TAG)"
          if [ -n "$CLEAN_ADMIN_VERSION" ]; then
            echo "Admin Version: $CLEAN_ADMIN_VERSION"
          fi

      - name: Update Versions in Codebase
        run: |
          CLEAN_WEB_VERSION="${{ steps.version_info.outputs.clean_web_version }}"
          CLEAN_ADMIN_VERSION="${{ steps.version_info.outputs.clean_admin_version }}"

          # 1. Update root package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$CLEAN_WEB_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # 2. Update apps/web package.json
          node -e "
            const fs = require('fs');
            const file = 'apps/web/package.json';
            if (fs.existsSync(file)) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = '$CLEAN_WEB_VERSION';
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

          # 3. Update personal-account-dropdown default version fallback
          node -e "
            const fs = require('fs');
            const file = 'packages/features/accounts/src/components/personal-account-dropdown.tsx';
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, 'utf8');
              content = content.replace(/appVersion\?\.version\s*\?\?\s*['\"][^'\"]+['\"]/, \"appVersion?.version ?? '$CLEAN_WEB_VERSION'\");
              fs.writeFileSync(file, content);
            }
          "

          # 4. Update apps/admin package.json if admin_version is provided
          if [ -n "$CLEAN_ADMIN_VERSION" ]; then
            node -e "
              const fs = require('fs');
              const file = 'apps/admin/package.json';
              if (fs.existsSync(file)) {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = '$CLEAN_ADMIN_VERSION';
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              }
            "
          fi

      - name: Build PR Description
        id: pr_body
        run: |
          cat << 'EOF' > /tmp/pr_body.md
          ## 🚀 Release Summary

          - **Web Application Version**: `${{ steps.version_info.outputs.clean_web_version }}`
          EOF

          if [ -n "${{ steps.version_info.outputs.clean_admin_version }}" ]; then
            echo "- **Admin Panel Version**: \`${{ steps.version_info.outputs.clean_admin_version }}\`" >> /tmp/pr_body.md
          fi

          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "" >> /tmp/pr_body.md
            echo "### Release Notes" >> /tmp/pr_body.md
            echo "${{ github.event.inputs.release_notes }}" >> /tmp/pr_body.md
          fi

          echo "" >> /tmp/pr_body.md
          echo "---" >> /tmp/pr_body.md
          echo "*Automated Release Pull Request created via GitHub Actions.*" >> /tmp/pr_body.md

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): bump version to ${{ steps.version_info.outputs.web_tag }}"
          branch: "release/${{ steps.version_info.outputs.web_tag }}"
          delete-branch: true
          base: ${{ github.event.inputs.target_branch }}
          title: "Release: ${{ steps.version_info.outputs.web_tag }}"
          body-path: /tmp/pr_body.md
          labels: |
            release
            automated-pr

      - name: Display PR URL
        run: |
          echo "Pull Request URL: ${{ steps.create_pr.outputs.pull-request-url }}"
          echo "Pull Request Number: ${{ steps.create_pr.outputs.pull-request-number }}"

      - name: Create Tag and GitHub Release (Optional)
        if: ${{ github.event.inputs.create_tag_and_release == 'true' || github.event.inputs.create_tag_and_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.web_tag }}
          name: Release ${{ steps.version_info.outputs.web_tag }}
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
